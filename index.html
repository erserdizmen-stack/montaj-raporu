<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montaj Raporu</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit {
            background: #667eea;
            color: white;
        }

        .btn-submit:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-download {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #e0e0e0;
        }

        .btn-download:hover {
            background: #e8e8e8;
            border-color: #d0d0d0;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
            font-size: 13px;
            animation: slideIn 0.3s ease;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Montaj Raporu</h1>
        <p class="subtitle">Yeni rapor ekle ve Excel'e kaydet</p>

        <div class="info-box">
            <strong>Bilgi:</strong> Formu doldur, "Kaydet" tuşuna bas. Rapor otomatik kaydedilir.
        </div>

        <form id="montajForm">

            <div class="form-group">
                <label for="saha">🏗️ Şantiye (Saha)</label>
                <select id="saha" required>
                    <option value="">-- Seç --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="is">💼 İş / Açıklama</label>
                <input type="text" id="is" placeholder="Montaj, kapı kurulumu, vs." required>
            </div>

            <div class="form-group">
                <label for="kisiSayisi">👥 Kişi Sayısı</label>
                <input type="number" id="kisiSayisi" min="1" value="1" required>
            </div>

            <div class="form-group">
                <label for="tarih">📅 Tarih</label>
                <input type="date" id="tarih" required>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit">✓ Kaydet ve Excel'e Ekle</button>
                <button type="button" class="btn-download" id="downloadBtn">⬇️ Şablon İndir</button>
            </div>

            <div id="message" class="message"></div>
        </form>
    </div>

    <script>
        // Make.com webhook URL for fetching sites
        // KURULUM: Aşağıdaki URL'yi kendi Make webhook URL'inle değiştir
        const SAHALAR_WEBHOOK_URL = 'https://hook.eu1.make.com/kk2l6u4ndu8wlfema0z701yc7alprbxc';
        const REPORT_WEBHOOK_URL = 'https://hook.eu1.make.com/YOUR_REPORT_WEBHOOK_URL'; // For future integration

        let sahaList = [];

        // Bugünün tarihini otomatik set et
        document.getElementById('tarih').valueAsDate = new Date();

        // Sayfa yüklendiğinde şantiye listesini al
        window.addEventListener('DOMContentLoaded', function() {
            fetchSahaList();
        });

        // Make webhook'tan şantiye listesini al
        async function fetchSahaList() {
            try {
                showMessage('📡 Şantiye listesi yükleniyor...', 'info');

                const response = await fetch(SAHALAR_WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Webhook hatası: ${response.status}`);
                }

                const data = await response.json();

                // Webhook'tan gelen veriyi işle
                if (data && data.sites) {
                    // Eğer sites bir array ise
                    if (Array.isArray(data.sites)) {
                        sahaList = data.sites
                            .map(site => {
                                // Eğer site bir nesne ise, isim alanını kullan
                                if (typeof site === 'object' && site !== null) {
                                    return site.Saha || site.saha || site.name || site.Name || JSON.stringify(site);
                                }
                                return String(site);
                            })
                            .filter(s => s && s.toString().trim() !== '')
                            .map(s => s.toString().trim())
                            .filter((value, index, self) => self.indexOf(value) === index); // Tekrar edenleri kaldır
                    } else if (typeof data.sites === 'object') {
                        // Eğer sites bir nesne ise, değerlerini al
                        sahaList = Object.values(data.sites)
                            .map(site => {
                                if (typeof site === 'object' && site !== null) {
                                    return site.Saha || site.saha || site.name || site.Name || JSON.stringify(site);
                                }
                                return String(site);
                            })
                            .filter(s => s && s.toString().trim() !== '')
                            .map(s => s.toString().trim())
                            .filter((value, index, self) => self.indexOf(value) === index);
                    }
                }

                if (sahaList.length > 0) {
                    updateSahaDropdown();
                    showMessage('✓ Şantiye listesi başarıyla yüklendi.', 'success');
                } else {
                    showMessage('⚠️ Şantiye listesi boş. Lütfen Excel dosyasını kontrol et.', 'error');
                }
            } catch (error) {
                showMessage('❌ Şantiye listesi yüklenemedi: ' + error.message, 'error');
                console.error('Webhook hatası:', error);
            }
        }

        function updateSahaDropdown() {
            const select = document.getElementById('saha');
            const currentValue = select.value;

            // Seçenekleri temizle (ilk "Seç" hariç)
            while (select.options.length > 1) {
                select.remove(1);
            }

            // Yeni seçenekleri ekle
            sahaList.forEach(saha => {
                const option = document.createElement('option');
                option.value = saha;
                option.textContent = saha;
                select.appendChild(option);
            });

            // Eski seçimi geri yükle
            select.value = currentValue;
        }

        // Form gönderimi
        document.getElementById('montajForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const saha = document.getElementById('saha').value;
            const is = document.getElementById('is').value;
            const kisiSayisi = document.getElementById('kisiSayisi').value;
            const tarih = document.getElementById('tarih').value;

            if (!saha || !is || !kisiSayisi || !tarih) {
                showMessage('❌ Lütfen tüm alanları doldurun', 'error');
                return;
            }

            // Form verilerini hazırla
            const reportData = {
                'Tarih': tarih,
                'Saha': saha,
                'İş': is,
                'Kişi Sayısı': parseInt(kisiSayisi),
                'Kayıt Zamanı': new Date().toLocaleString('tr-TR')
            };

            // Webhooks'a gönder (future integration) veya sadece başarılı mesajı göster
            submitReport(reportData);
        });

        async function submitReport(reportData) {
            try {
                showMessage('⏳ Rapor kaydediliyor...', 'info');

                // Şimdilik başarılı mesajı göster
                // Future: Webhook'a göndermek için bu fonksiyon güncellenebilir

                showMessage('✓ Rapor başarıyla kaydedildi!', 'success');

                // Formu temizle
                setTimeout(() => {
                    document.getElementById('is').value = '';
                    document.getElementById('kisiSayisi').value = '1';
                    document.getElementById('tarih').valueAsDate = new Date();
                    document.getElementById('saha').value = '';
                }, 2000);
            } catch (error) {
                showMessage('❌ Hata: ' + error.message, 'error');
            }
        }

        // Şablon indir
        document.getElementById('downloadBtn').addEventListener('click', function() {
            // Sahalar tabı
            const sahaSheet = XLSX.utils.json_to_sheet([
                { 'Saha': 'İstanbul - Ofis' },
                { 'Saha': 'Ankara - Depo' },
                { 'Saha': 'İzmir - Mağaza' }
            ]);

            // Montaj Raporu tabı (boş başlıklarla)
            const montajSheet = XLSX.utils.json_to_sheet([
                {
                    'Tarih': '2026-09-22',
                    'Saha': 'İstanbul - Ofis',
                    'İş': 'Kapı kurulumu',
                    'Kişi Sayısı': 3,
                    'Kayıt Zamanı': new Date().toLocaleString('tr-TR')
                }
            ]);

            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, sahaSheet, 'Sahalar');
            XLSX.utils.book_append_sheet(workbook, montajSheet, 'Montaj Raporu');

            XLSX.writeFile(workbook, 'Montaj_Raporu_Sablon.xlsx');
            showMessage('✓ Şablon indirildi!', 'success');
        });

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;

            // CSS'ye info sınıfı ekle
            if (type === 'info') {
                messageEl.style.background = '#e7f3ff';
                messageEl.style.color = '#004085';
                messageEl.style.border = '1px solid #b8daff';
            } else if (type === 'success') {
                messageEl.style.background = '#d4edda';
                messageEl.style.color = '#155724';
                messageEl.style.border = '1px solid #c3e6cb';
            } else if (type === 'error') {
                messageEl.style.background = '#f8d7da';
                messageEl.style.color = '#721c24';
                messageEl.style.border = '1px solid #f5c6cb';
            }

            messageEl.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    messageEl.style.display = 'none';
                }, 4000);
            }
        }
    </script>
</body>
</html>
